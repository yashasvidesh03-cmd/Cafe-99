<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vrindavan — Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A0A09;--surface:#161614;--border:#242422;--text:#F0EDE8;--muted:#6A6A68;--green:#3D9B65;--warn:#E8B84B;--red:#C84040;--gold:#D4A43A}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
.k-logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--text);margin-bottom:4px;text-align:center}
.k-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px}
.k-form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px}
.k-input{background:var(--surface);border:1.5px solid var(--border);color:var(--text);padding:13px 16px;border-radius:12px;font-family:'Jost',sans-serif;font-size:14px;outline:none;transition:border-color .2s;width:100%}
.k-input:focus{border-color:var(--gold)}
.k-input::placeholder{color:var(--muted)}
.k-btn{background:var(--gold);color:#000;border:none;padding:14px;border-radius:12px;font-family:'Jost',sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:opacity .2s}
.k-btn:hover{opacity:.88}
.k-btn:disabled{opacity:.4;cursor:not-allowed}
.k-err{font-size:12px;color:var(--red);display:none;text-align:center}
.k-hint{font-size:11px;color:var(--muted);text-align:center}

/* MAIN */
#kitchenApp{display:none}
.k-nav{background:var(--surface);height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.k-nav-brand{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--text)}
.k-nav-brand span{font-family:'Jost',sans-serif;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-left:8px}
.k-logout{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;font-family:'Jost',sans-serif;font-size:11px;cursor:pointer}
.k-logout:hover{color:var(--text);border-color:var(--text)}
.k-body{padding:12px}
.stats-bar{display:flex;gap:8px;margin-bottom:14px}
.stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;flex:1;text-align:center}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600}
.stat-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.new-count{color:var(--warn)}.prep-count{color:var(--gold)}.ready-count{color:var(--green)}
.live-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.live-dot.offline{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live-text{font-size:11px;color:var(--muted)}
.orders-grid{display:flex;flex-direction:column;gap:10px}
.k-order{border-radius:14px;padding:16px;border:2px solid;transition:all .2s}
.k-order.new{background:rgba(232,184,75,.06);border-color:var(--warn);animation:newPulse 1.5s ease 4}
@keyframes newPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 20px rgba(232,184,75,.3)}}
.k-order.preparing{background:rgba(212,164,58,.04);border-color:var(--gold)}
.k-order.ready{background:rgba(61,155,101,.06);border-color:var(--green)}
.ko-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ko-table{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--text)}
.ko-meta{font-size:11px;color:var(--muted);margin-top:2px}
.ko-time{text-align:right}
.ko-mins{font-size:20px;font-weight:600;font-family:'Cormorant Garamond',serif}
.ko-mins.ok{color:var(--green)}.ko-mins.warn{color:var(--warn)}.ko-mins.late{color:var(--red)}
.ko-mins-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.ko-items{margin-bottom:14px}
.ko-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ko-item:last-child{border-bottom:none}
.ko-item-name{font-size:14px;font-weight:500;color:var(--text)}
.ko-item-qty{font-size:20px;font-weight:600;color:var(--gold);font-family:'Cormorant Garamond',serif;min-width:32px;text-align:right}
.ko-instr{background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.2);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:12px;color:var(--warn);font-style:italic}
.ko-actions{display:flex;gap:8px}
.ko-act{flex:1;border:none;padding:12px;border-radius:10px;font-family:'Jost',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s}
.ko-act.start{background:var(--warn);color:#000}.ko-act.start:hover{opacity:.88}
.ko-act.ready-btn{background:var(--green);color:#fff}.ko-act.ready-btn:hover{opacity:.88}
.ko-act.done{background:var(--surface);border:1px solid var(--green);color:var(--green);flex:none;padding:12px 16px}
.k-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.k-empty-icon{font-size:48px;margin-bottom:12px}
.k-empty-text{font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="k-logo">Vrindavan</div>
  <div class="k-sub">Kitchen Display</div>
  <div class="k-form">
    <input class="k-input" id="kEmail" type="email" placeholder="Email" oninput="validateKLogin()">
    <input class="k-input" id="kPass" type="password" placeholder="Password" oninput="validateKLogin()" onkeydown="if(event.key==='Enter')doKLogin()">
    <div class="k-err" id="kErr"></div>
    <button class="k-btn" id="kBtn" onclick="doKLogin()" disabled>Enter Kitchen</button>
    <div class="k-hint">kitchen@vrindavan.com</div>
  </div>
</div>

<!-- KITCHEN APP -->
<div id="kitchenApp">
  <div class="k-nav">
    <div class="k-nav-brand">Vrindavan <span>Kitchen</span></div>
    <button class="k-logout" onclick="doKLogout()">Exit</button>
  </div>
  <div class="k-body">
    <div class="stats-bar">
      <div class="stat-chip"><div class="stat-val new-count" id="cnt-new">0</div><div class="stat-lbl">New</div></div>
      <div class="stat-chip"><div class="stat-val prep-count" id="cnt-prep">0</div><div class="stat-lbl">Preparing</div></div>
      <div class="stat-chip"><div class="stat-val ready-count" id="cnt-ready">0</div><div class="stat-lbl">Ready</div></div>
    </div>
    <div class="live-bar">
      <div class="live-dot" id="liveDot"></div>
      <div class="live-text" id="liveText">Connecting to Firebase...</div>
    </div>
    <div class="orders-grid" id="kitchenOrders"></div>
  </div>
</div>

<div class="toast" id="kToast"></div>

<script type="module">
// ── FIREBASE ────────────────────────────────────────────────
import { initializeApp }                              from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where,
         onSnapshot, doc, updateDoc, addDoc,
         serverTimestamp, orderBy }                   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4ucjiF7IjSJUnVS0hFURYI75xZaTLo7k",
  authDomain: "cafe-99.firebaseapp.com",
  databaseURL: "https://cafe-99-default-rtdb.firebaseio.com",
  projectId: "cafe-99",
  storageBucket: "cafe-99.firebasestorage.app",
  messagingSenderId: "750275360719",
  appId: "1:750275360719:web:23aed0aca397a88ae304ba"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── ALLOWED ROLE FOR THIS PAGE ──────────────────────────────
const ALLOWED_ROLES = ['kitchen', 'admin', 'owner'];

// ── STATE ───────────────────────────────────────────────────
let unsubOrders = null; // Firestore listener unsubscribe fn

// ── LOGIN ───────────────────────────────────────────────────
window.validateKLogin = () => {
  const e = document.getElementById('kEmail').value;
  const p = document.getElementById('kPass').value;
  document.getElementById('kBtn').disabled = !(e && p.length >= 4);
};

window.doKLogin = async () => {
  const email = document.getElementById('kEmail').value.trim();
  const pass  = document.getElementById('kPass').value;
  const err   = document.getElementById('kErr');
  const btn   = document.getElementById('kBtn');
  btn.disabled = true; btn.textContent = 'Entering...';
  err.style.display = 'none';

  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    // Check role from Firestore
    const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const snap = await getDoc(doc(db, 'staff', cred.user.uid));
    const role = snap.exists() ? snap.data().role : null;

    if (!ALLOWED_ROLES.includes(role)) {
      await signOut(auth);
      err.textContent = 'Access denied — kitchen staff only';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Enter Kitchen';
      return;
    }
    openKitchen();
  } catch (e) {
    err.textContent = e.code === 'auth/invalid-credential' ? 'Wrong email or password' : (e.message || 'Login failed');
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Enter Kitchen';
  }
};

window.doKLogout = async () => {
  if (unsubOrders) unsubOrders();
  await signOut(auth);
  document.getElementById('kitchenApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('kPass').value = '';
  document.getElementById('kBtn').disabled = true;
  document.getElementById('kBtn').textContent = 'Enter Kitchen';
};

// Restore session if already logged in
auth.onAuthStateChanged(user => {
  if (user) openKitchen();
});

// ── OPEN KITCHEN ─────────────────────────────────────────────
function openKitchen() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('kitchenApp').style.display  = 'block';
  subscribeOrders();
}

// ── FIRESTORE LIVE LISTENER ──────────────────────────────────
function subscribeOrders() {
  setLive(false, 'Connecting...');

  // Listen to all orders that are not yet served
  const q = query(
    collection(db, 'orders'),
    where('status', 'in', ['new', 'preparing', 'ready']),
    orderBy('createdAt', 'asc')
  );

  unsubOrders = onSnapshot(q,
    (snapshot) => {
      const orders = [];
      snapshot.forEach(d => orders.push({ _id: d.id, ...d.data() }));
      setLive(true, `Live · ${orders.length} active order${orders.length !== 1 ? 's' : ''}`);
      renderKitchen(orders);

      // Beep on new orders (added docs)
      snapshot.docChanges().forEach(change => {
        if (change.type === 'added' && change.doc.data().status === 'new') {
          playKSound('new');
          kToast(`🍽️ New order — Table ${change.doc.data().table}`);
        }
      });
    },
    (error) => {
      setLive(false, 'Connection lost — retrying...');
      console.error(error);
    }
  );
}

function setLive(on, text) {
  document.getElementById('liveDot').className  = 'live-dot' + (on ? '' : ' offline');
  document.getElementById('liveText').textContent = text;
}

// ── RENDER ───────────────────────────────────────────────────
function renderKitchen(orders) {
  document.getElementById('cnt-new').textContent  = orders.filter(o => o.status === 'new').length;
  document.getElementById('cnt-prep').textContent = orders.filter(o => o.status === 'preparing').length;
  document.getElementById('cnt-ready').textContent = orders.filter(o => o.status === 'ready').length;

  if (!orders.length) {
    document.getElementById('kitchenOrders').innerHTML =
      `<div class="k-empty"><div class="k-empty-icon">✅</div><div class="k-empty-text">All caught up! No pending orders.</div></div>`;
    return;
  }

  // Sort: new first, then preparing, then ready
  const sorted = [...orders].sort((a, b) => {
    const rank = { new: 0, preparing: 1, ready: 2 };
    return (rank[a.status] ?? 3) - (rank[b.status] ?? 3);
  });

  document.getElementById('kitchenOrders').innerHTML = sorted.map(o => {
    const createdAt = o.createdAt?.toDate ? o.createdAt.toDate() : new Date(o.createdAt || Date.now());
    const mins      = Math.floor((Date.now() - createdAt.getTime()) / 60000);
    const timeCls   = mins > 20 ? 'late' : mins > 10 ? 'warn' : 'ok';
    const items     = (o.items || []).map(i =>
      `<div class="ko-item"><div class="ko-item-name">${i.name}</div><div class="ko-item-qty">×${i.qty}</div></div>`
    ).join('');
    const note = o.instructions ? `<div class="ko-instr">📝 ${o.instructions}</div>` : '';

    let actions = '';
    if (o.status === 'new')
      actions = `<button class="ko-act start"    onclick="window.updateKStatus('${o._id}','preparing')">Start Preparing</button>`;
    else if (o.status === 'preparing')
      actions = `<button class="ko-act ready-btn" onclick="window.updateKStatus('${o._id}','ready')">Mark Ready ✓</button>`;
    else if (o.status === 'ready')
      actions = `<button class="ko-act done"      onclick="window.updateKStatus('${o._id}','served')">Waiter Notified</button>`;

    return `<div class="k-order ${o.status}">
      <div class="ko-top">
        <div><div class="ko-table">Table ${o.table}</div><div class="ko-meta">#${o.orderId || o._id.slice(-6).toUpperCase()} · ${o.customer || 'Guest'}</div></div>
        <div class="ko-time"><div class="ko-mins ${timeCls}">${mins}m</div><div class="ko-mins-lbl">waiting</div></div>
      </div>
      <div class="ko-items">${items}</div>
      ${note}
      <div class="ko-actions">${actions}</div>
    </div>`;
  }).join('');
}

// ── UPDATE STATUS ────────────────────────────────────────────
window.updateKStatus = async (docId, status) => {
  try {
    const orderRef = doc(db, 'orders', docId);
    const update   = { status, updatedAt: serverTimestamp() };

    // When kitchen marks ready → write an alert for the waiter
    if (status === 'ready') {
      // Get order data first to include table info
      const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const snap = await getDoc(orderRef);
      if (snap.exists()) {
        const o = snap.data();
        await addDoc(collection(db, 'alerts'), {
          type:      'order_ready',
          orderId:   o.orderId || docId,
          table:     o.table,
          message:   `Order ${o.orderId || '#'+docId.slice(-4)} (Table ${o.table}) is ready to serve!`,
          acked:     false,
          createdAt: serverTimestamp()
        });
      }
    }

    await updateDoc(orderRef, update);

    if (status === 'ready')     kToast(`Table ${getTableFromId(docId)} — Ready! Waiter notified`);
    else if (status === 'preparing') kToast(`Started preparing`);
    else if (status === 'served')    kToast(`Marked as served ✓`);

    playKSound(status);
  } catch (e) {
    kToast('Update failed — check connection');
    console.error(e);
  }
};

function getTableFromId(docId) {
  // Try to read from rendered DOM as a fallback
  return '?';
}

// ── AUDIO ────────────────────────────────────────────────────
function playKSound(status) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (status === 'ready') {
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.setValueAtTime(550, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(660, ctx.currentTime + 0.2);
    } else if (status === 'new') {
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.setValueAtTime(660, ctx.currentTime + 0.12);
    } else {
      osc.frequency.setValueAtTime(330, ctx.currentTime);
    }
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
  } catch {}
}

// ── TOAST ────────────────────────────────────────────────────
let kToastTimer;
window.kToast = (msg) => {
  const el = document.getElementById('kToast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(kToastTimer);
  kToastTimer = setTimeout(() => el.classList.remove('show'), 2800);
};
</script>
</body>
</html>
