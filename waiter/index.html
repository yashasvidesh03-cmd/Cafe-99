<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vrindavan — Waiter</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#F6F4F0;--surface:#FFF;--border:#E8E4DC;--text:#1C1C1A;--muted:#8A8780;--accent:#C8922A;--green:#2D7A4F;--red:#B83232;--dark:#141412;--gold:#C8922A}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
.w-logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--text);margin-bottom:4px;text-align:center}
.w-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px}
.w-form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px}
.w-input{background:var(--surface);border:1.5px solid var(--border);color:var(--text);padding:13px 16px;border-radius:12px;font-family:'Jost',sans-serif;font-size:14px;outline:none;transition:border-color .2s;width:100%}
.w-input:focus{border-color:var(--accent)}
.w-input::placeholder{color:var(--muted)}
.w-btn{background:var(--dark);color:#fff;border:none;padding:14px;border-radius:12px;font-family:'Jost',sans-serif;font-weight:500;font-size:15px;cursor:pointer;transition:opacity .2s}
.w-btn:hover{opacity:.85}
.w-btn:disabled{opacity:.4;cursor:not-allowed}
.w-err{font-size:12px;color:var(--red);display:none;text-align:center}
.w-hint{font-size:11px;color:var(--muted);text-align:center}

/* MAIN */
#waiterApp{display:none}
.w-nav{background:var(--dark);height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.w-nav-brand{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:#fff}
.w-nav-brand span{font-family:'Jost',sans-serif;font-size:10px;color:rgba(255,255,255,.4);letter-spacing:1px;text-transform:uppercase;margin-left:8px}
.w-nav-right{display:flex;align-items:center;gap:8px}
.w-logout{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.7);padding:6px 12px;border-radius:8px;font-family:'Jost',sans-serif;font-size:11px;cursor:pointer}

/* TABS */
.w-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:99}
.w-tab{flex:1;padding:12px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
.w-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-badge{background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* LIVE PILL */
.live-pill{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:100px;background:rgba(45,122,79,.12);color:var(--green)}
.live-pill.offline{background:rgba(184,50,50,.1);color:var(--red)}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.3s infinite}
.ldot.offline{background:var(--red);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.w-body{padding:12px 14px}

/* STATS */
.w-stats{display:flex;gap:8px;margin-bottom:14px}
.w-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;flex:1;text-align:center}
.w-stat-val{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--text)}
.w-stat-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

/* ALERT CARDS */
.call-alert{background:#fff;border:2px solid var(--red);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;animation:alertPulse 1s ease infinite}
@keyframes alertPulse{0%,100%{box-shadow:0 0 0 0 rgba(184,50,50,0)}50%{box-shadow:0 0 0 6px rgba(184,50,50,.15)}}
.call-alert-table{font-size:15px;font-weight:600;color:var(--red)}
.call-alert-time{font-size:11px;color:var(--muted)}
.call-respond-btn{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;cursor:pointer}

/* READY ALERT */
.ready-alert{background:#fff;border:2px solid var(--green);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;animation:alertPulse2 1.2s ease infinite}
@keyframes alertPulse2{0%,100%{box-shadow:0 0 0 0 rgba(45,122,79,0)}50%{box-shadow:0 0 0 5px rgba(45,122,79,.15)}}
.ready-alert-table{font-size:15px;font-weight:600;color:var(--green)}
.ready-respond-btn{background:var(--green);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;cursor:pointer}

/* SECTION */
.sec-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ORDER CARDS */
.w-order{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;transition:all .2s}
.w-order.ready{border-color:var(--green);background:rgba(45,122,79,.03)}
.wo-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.wo-table{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--text)}
.wo-meta{font-size:11px;color:var(--muted);margin-top:2px}
.wo-status{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:4px 9px;border-radius:20px}
.ws-ready{background:rgba(45,122,79,.12);color:var(--green)}
.ws-preparing{background:rgba(200,146,42,.12);color:var(--gold)}
.ws-new{background:rgba(232,184,75,.12);color:#D4A43A}
.ws-served{background:#F3E5F5;color:#6A1B9A}
.wo-items{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.wo-instr{font-size:12px;color:var(--gold);font-style:italic;margin-bottom:10px}
.wo-actions{display:flex;gap:8px}
.wo-act{flex:1;border:none;padding:11px;border-radius:10px;font-family:'Jost',sans-serif;font-weight:500;font-size:13px;cursor:pointer;transition:all .2s}
.wo-act.collect{background:var(--dark);color:#fff}.wo-act.collect:hover{opacity:.85}
.wo-act.secondary{background:var(--bg);border:1px solid var(--border);color:var(--text)}

.spacer{height:16px}
.empty-state{text-align:center;padding:40px 0;color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--dark);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="w-logo">Vrindavan</div>
  <div class="w-sub">Waiter App</div>
  <div class="w-form">
    <input class="w-input" id="wEmail" type="email" placeholder="Email" oninput="validateW()">
    <input class="w-input" id="wPass" type="password" placeholder="Password" oninput="validateW()" onkeydown="if(event.key==='Enter')doWLogin()">
    <div class="w-err" id="wErr"></div>
    <button class="w-btn" id="wBtn" onclick="doWLogin()" disabled>Sign In</button>
    <div class="w-hint">waiter@vrindavan.com</div>
  </div>
</div>

<!-- WAITER APP -->
<div id="waiterApp">
  <div class="w-nav">
    <div class="w-nav-brand">Vrindavan <span>Waiter</span></div>
    <div class="w-nav-right">
      <div class="live-pill" id="livePill"><div class="ldot" id="ldot"></div><span id="liveLabel">Live</span></div>
      <button class="w-logout" onclick="doWLogout()">Exit</button>
    </div>
  </div>

  <div class="w-tabs">
    <div class="w-tab active" id="tab-alerts" onclick="switchTab('alerts')">
      🔔 Alerts <div class="tab-badge" id="alertBadge">0</div>
    </div>
    <div class="w-tab" id="tab-orders" onclick="switchTab('orders')">📋 Orders</div>
  </div>

  <!-- ALERTS TAB -->
  <div id="pane-alerts" class="w-body">
    <div id="alertsList"></div>
  </div>

  <!-- ORDERS TAB -->
  <div id="pane-orders" class="w-body hidden">
    <div class="w-stats">
      <div class="w-stat"><div class="w-stat-val" id="w-cnt-ready" style="color:var(--green)">0</div><div class="w-stat-lbl">Ready</div></div>
      <div class="w-stat"><div class="w-stat-val" id="w-cnt-prep">0</div><div class="w-stat-lbl">Preparing</div></div>
      <div class="w-stat"><div class="w-stat-val" id="w-cnt-served">0</div><div class="w-stat-lbl">Served</div></div>
    </div>
    <div class="sec-label">Ready to Serve</div>
    <div id="readyOrders"></div>
    <div class="spacer"></div>
    <div class="sec-label">All Active Orders</div>
    <div id="allOrders"></div>
  </div>
</div>

<div class="toast" id="wToast"></div>

<script type="module">
// ── FIREBASE ────────────────────────────────────────────────
import { initializeApp }                               from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, doc,
         onSnapshot, updateDoc, serverTimestamp,
         orderBy, getDoc }                             from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4ucjiF7IjSJUnVS0hFURYI75xZaTLo7k",
  authDomain: "cafe-99.firebaseapp.com",
  databaseURL: "https://cafe-99-default-rtdb.firebaseio.com",
  projectId: "cafe-99",
  storageBucket: "cafe-99.firebasestorage.app",
  messagingSenderId: "750275360719",
  appId: "1:750275360719:web:23aed0aca397a88ae304ba"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const ALLOWED_ROLES = ['waiter', 'admin', 'owner'];
let unsubOrders = null;
let unsubAlerts = null;
let activeTab   = 'alerts';

// ── LOGIN ────────────────────────────────────────────────────
window.validateW = () => {
  document.getElementById('wBtn').disabled =
    !(document.getElementById('wEmail').value && document.getElementById('wPass').value.length >= 4);
};

window.doWLogin = async () => {
  const email = document.getElementById('wEmail').value.trim();
  const pass  = document.getElementById('wPass').value;
  const err   = document.getElementById('wErr');
  const btn   = document.getElementById('wBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  err.style.display = 'none';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const snap = await getDoc(doc(db, 'staff', cred.user.uid));
    const role = snap.exists() ? snap.data().role : null;
    if (!ALLOWED_ROLES.includes(role)) {
      await signOut(auth);
      err.textContent = 'Access denied — waiter staff only';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign In';
      return;
    }
    openWaiter();
  } catch (e) {
    err.textContent = e.code === 'auth/invalid-credential' ? 'Wrong email or password' : (e.message || 'Login failed');
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign In';
  }
};

window.doWLogout = async () => {
  if (unsubOrders) unsubOrders();
  if (unsubAlerts) unsubAlerts();
  await signOut(auth);
  document.getElementById('waiterApp').style.display  = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('wPass').value = '';
  document.getElementById('wBtn').disabled = true;
  document.getElementById('wBtn').textContent = 'Sign In';
};

auth.onAuthStateChanged(user => { if (user) openWaiter(); });

// ── OPEN WAITER ──────────────────────────────────────────────
function openWaiter() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('waiterApp').style.display   = 'block';
  subscribeAlerts();
  subscribeOrders();
}

// ── FIRESTORE: ALERTS ────────────────────────────────────────
function subscribeAlerts() {
  const q = query(
    collection(db, 'alerts'),
    where('acked', '==', false),
    orderBy('createdAt', 'desc')
  );
  unsubAlerts = onSnapshot(q, snapshot => {
    const alerts = [];
    snapshot.forEach(d => alerts.push({ _id: d.id, ...d.data() }));

    // Badge count
    document.getElementById('alertBadge').textContent = alerts.length;

    // Vibrate + sound on new alerts
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        vibrate();
        playAlert();
        wToast(change.doc.data().type === 'waiter_call'
          ? `🙋 Table ${change.doc.data().table} needs you!`
          : `✅ Order ready — Table ${change.doc.data().table}`);
      }
    });

    renderAlerts(alerts);
    setLive(true);
  }, () => setLive(false));
}

// ── FIRESTORE: ORDERS ────────────────────────────────────────
function subscribeOrders() {
  const q = query(
    collection(db, 'orders'),
    where('status', 'in', ['new', 'preparing', 'ready', 'served']),
    orderBy('createdAt', 'desc')
  );
  unsubOrders = onSnapshot(q, snapshot => {
    const orders = [];
    snapshot.forEach(d => orders.push({ _id: d.id, ...d.data() }));
    renderOrders(orders);
  });
}

// ── RENDER ALERTS ────────────────────────────────────────────
function renderAlerts(alerts) {
  if (!alerts.length) {
    document.getElementById('alertsList').innerHTML =
      '<div class="empty-state">✅ No pending alerts — all clear!</div>';
    return;
  }
  document.getElementById('alertsList').innerHTML = alerts.map(a => {
    const ts  = a.createdAt?.toDate ? a.createdAt.toDate() : new Date();
    const age = Math.floor((Date.now() - ts.getTime()) / 60000);
    if (a.type === 'waiter_call') {
      return `<div class="call-alert">
        <div><div class="call-alert-table">🙋 Table ${a.table} needs you</div>
        <div class="call-alert-time">${age < 1 ? 'Just now' : age + 'm ago'}</div></div>
        <button class="call-respond-btn" onclick="ackAlert('${a._id}')">Respond ✓</button>
      </div>`;
    } else {
      return `<div class="ready-alert">
        <div><div class="ready-alert-table">✅ ${a.message || 'Order ready — Table ' + a.table}</div>
        <div class="call-alert-time">${age < 1 ? 'Just now' : age + 'm ago'}</div></div>
        <button class="ready-respond-btn" onclick="ackAlert('${a._id}')">Got it ✓</button>
      </div>`;
    }
  }).join('');
}

// ── RENDER ORDERS ────────────────────────────────────────────
function renderOrders(orders) {
  const ready    = orders.filter(o => o.status === 'ready');
  const active   = orders.filter(o => ['new','preparing','ready'].includes(o.status));

  document.getElementById('w-cnt-ready').textContent  = ready.length;
  document.getElementById('w-cnt-prep').textContent   = orders.filter(o => o.status === 'preparing').length;
  document.getElementById('w-cnt-served').textContent = orders.filter(o => o.status === 'served').length;

  // Ready section
  document.getElementById('readyOrders').innerHTML = ready.length
    ? ready.map(o => orderCard(o, true)).join('')
    : '<div class="empty-state">No orders ready to serve right now</div>';

  // All active
  document.getElementById('allOrders').innerHTML = active.length
    ? active.map(o => orderCard(o, false)).join('')
    : '<div class="empty-state">No active orders</div>';
}

function orderCard(o, isReadySection) {
  const statusMap  = { ready:'ws-ready', preparing:'ws-preparing', new:'ws-new', served:'ws-served' };
  const statusLbl  = { ready:'Ready ✓', preparing:'Preparing', new:'New', served:'Served' };
  const items = Array.isArray(o.items)
    ? o.items.map(i => `${i.name} ×${i.qty}`).join(', ')
    : (o.items || '');
  const note  = o.instructions ? `<div class="wo-instr">📝 ${o.instructions}</div>` : '';
  let btn = '';
  if (o.status === 'ready')
    btn = `<button class="wo-act collect" onclick="markServed('${o._id}', ${o.table})">Mark as Served →</button>`;
  else if (o.status === 'served')
    btn = `<button class="wo-act collect" onclick="markCollected('${o._id}', ${o.table})">Cash Collected ✓</button>`;
  else
    btn = `<button class="wo-act secondary" disabled style="opacity:.5">Kitchen Preparing...</button>`;

  return `<div class="w-order ${o.status === 'ready' ? 'ready' : ''}">
    <div class="wo-top">
      <div><div class="wo-table">Table ${o.table}</div><div class="wo-meta">${o.customer || 'Guest'} · #${o.orderId || o._id.slice(-6).toUpperCase()}</div></div>
      <span class="wo-status ${statusMap[o.status] || ''}">${statusLbl[o.status] || o.status}</span>
    </div>
    <div class="wo-items">${items}</div>
    ${note}
    <div class="wo-actions">${btn}</div>
  </div>`;
}

// ── ACTIONS ──────────────────────────────────────────────────
window.ackAlert = async (alertId) => {
  await updateDoc(doc(db, 'alerts', alertId), { acked: true, ackedAt: serverTimestamp() });
  wToast('Alert cleared ✓');
};

window.markServed = async (docId, table) => {
  await updateDoc(doc(db, 'orders', docId), { status: 'served', updatedAt: serverTimestamp() });
  wToast(`Table ${table} — Marked as served ✓`);
};

window.markCollected = async (docId, table) => {
  await updateDoc(doc(db, 'orders', docId), { status: 'collected', updatedAt: serverTimestamp() });
  wToast(`Cash collected from Table ${table} ✓`);
};

// ── TABS ─────────────────────────────────────────────────────
window.switchTab = (tab) => {
  activeTab = tab;
  document.getElementById('pane-alerts').classList.toggle('hidden', tab !== 'alerts');
  document.getElementById('pane-orders').classList.toggle('hidden', tab !== 'orders');
  document.getElementById('tab-alerts').classList.toggle('active', tab === 'alerts');
  document.getElementById('tab-orders').classList.toggle('active', tab === 'orders');
};

// ── UTILS ────────────────────────────────────────────────────
function setLive(on) {
  const pill  = document.getElementById('livePill');
  const dot   = document.getElementById('ldot');
  const label = document.getElementById('liveLabel');
  pill.className  = 'live-pill' + (on ? '' : ' offline');
  dot.className   = 'ldot' + (on ? '' : ' offline');
  label.textContent = on ? 'Live' : 'Offline';
}

function vibrate() { try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch {} }

let alertPlayed = false;
function playAlert() {
  if (alertPlayed) return;
  alertPlayed = true;
  setTimeout(() => alertPlayed = false, 20000);
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .15, .3].forEach(t => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 660;
      gain.gain.setValueAtTime(.2, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .15);
      osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + .15);
    });
  } catch {}
}

let wToastTimer;
window.wToast = (msg) => {
  const el = document.getElementById('wToast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(wToastTimer);
  wToastTimer = setTimeout(() => el.classList.remove('show'), 2800);
};
</script>
</body>
</html>
